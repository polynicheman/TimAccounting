<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Set up your Apex workspace in six guided steps." />
<meta name="theme-color" content="#0a0f1e" />
<title>Getting started · Apex</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f7cff'/%3E%3Cpath d='M16 6.5 25 25H7z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M10.6 19.5h10.8' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
/* ═══════════════════════════════════════════════════════════════════════
   APEX · DESIGN SYSTEM (shared)
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0a0f1e; --bg-2:#0d1322; --surface:#111a30; --surface-2:#16203a;
  --surface-3:#1d2a4a; --border:#23325a; --border-soft:#1a2646;
  --text:#eaf0ff; --text-muted:#94a5c8; --text-faint:#63759c;
  --brand:#4f7cff; --brand-2:#7aa2ff; --brand-3:#9b8cff;
  --brand-soft:rgba(79,124,255,.13);
  --good:#2fbf87; --good-soft:rgba(47,191,135,.14);
  --warn:#f0a13a; --warn-soft:rgba(240,161,58,.14);
  --bad:#ef5a6b; --bad-soft:rgba(239,90,107,.14);
  --neutral:#8b9bc4;
  --radius-sm:8px; --radius:14px; --radius-lg:20px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 10px 30px -12px rgba(0,0,0,.65);
  --shadow-lg:0 30px 70px -30px rgba(0,0,0,.8);
  --ring:0 0 0 3px rgba(79,124,255,.32);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
[data-theme="light"]{
  --bg:#f4f6fc; --bg-2:#eef2fb; --surface:#ffffff; --surface-2:#f5f7fc;
  --surface-3:#e9eef9; --border:#d5def0; --border-soft:#e4eaf6;
  --text:#0c1630; --text-muted:#4b5c80; --text-faint:#7989ab;
  --brand:#2a56d6; --brand-2:#4f7cff; --brand-3:#7c5cff;
  --brand-soft:rgba(42,86,214,.09);
  --good:#0f9d6b; --good-soft:rgba(15,157,107,.11);
  --warn:#bf720f; --warn-soft:rgba(191,114,15,.11);
  --bad:#d93a4d; --bad-soft:rgba(217,58,77,.11);
  --neutral:#6b7a96;
  --shadow-sm:0 1px 2px rgba(16,29,64,.06);
  --shadow:0 10px 30px -14px rgba(16,29,64,.2);
  --shadow-lg:0 30px 70px -30px rgba(16,29,64,.28);
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
  line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;
  display:flex;flex-direction:column;}
img,svg{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button,input,select,textarea{font:inherit;color:inherit;}
::selection{background:rgba(79,124,255,.3);}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:6px;}

/* ── Top bar ─────────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:60;
  backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  border-bottom:1px solid var(--border-soft);
  height:62px;display:flex;align-items:center;gap:18px;padding:0 22px;
}
.topbar-inner{width:100%;max-width:1240px;margin-inline:auto;
  display:flex;align-items:center;gap:18px;}
.brand{display:flex;align-items:center;gap:10px;
  font-weight:800;font-size:17px;letter-spacing:-.03em;}
.brand-mark{width:32px;height:32px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(145deg,var(--brand),#7c5cff);display:grid;
  place-items:center;box-shadow:0 6px 16px -8px rgba(79,124,255,.9);}
.brand-mark svg{width:17px;height:17px;}
.brand small{display:block;font-size:9.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);
  margin-top:-3px;}

.topbar-progress{flex:1;max-width:420px;margin-inline:auto;
  display:flex;align-items:center;gap:14px;}
.topbar-progress .bar{flex:1;height:6px;border-radius:999px;
  background:var(--surface-3);overflow:hidden;}
.topbar-progress .fill{height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,var(--brand),var(--good));
  transition:width .55s cubic-bezier(.34,1.3,.5,1);}
.topbar-progress .pct{font-family:var(--mono);font-size:12px;font-weight:600;
  color:var(--text-muted);min-width:38px;text-align:right;}

.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}

/* ── Buttons ─────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:10px;border:1px solid transparent;
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  user-select:none;transition:transform .12s,box-shadow .2s,background .2s,
    border-color .2s,opacity .2s;}
.btn:active{transform:translateY(1px) scale(.99);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:linear-gradient(145deg,var(--brand),#6b5cff);color:#fff;
  box-shadow:0 10px 22px -12px rgba(79,124,255,.95);}
.btn-primary:hover:not(:disabled){box-shadow:0 14px 28px -12px rgba(79,124,255,1);}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:var(--border);}
.btn-ghost:hover:not(:disabled){color:var(--text);background:var(--surface-2);}
.btn-soft{background:var(--surface-2);color:var(--text);border-color:var(--border);}
.btn-soft:hover:not(:disabled){background:var(--surface-3);}
.btn-lg{padding:13px 24px;font-size:15px;border-radius:12px;}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn svg{width:14px;height:14px;}

.icon-btn{width:36px;height:36px;display:grid;place-items:center;
  border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-muted);cursor:pointer;transition:.15s;}
.icon-btn:hover{color:var(--text);background:var(--surface-2);}
.icon-btn svg{width:16px;height:16px;}

/* ── Layout ──────────────────────────────────────────────────── */
.wizard{flex:1;max-width:1240px;width:100%;margin-inline:auto;
  padding:32px 22px 80px;display:grid;
  grid-template-columns:290px 1fr;gap:32px;align-items:start;}

/* ── Stepper ─────────────────────────────────────────────────── */
.stepper{position:sticky;top:90px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:22px 20px;box-shadow:var(--shadow);}
.stepper h2{font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--text-faint);margin:0 0 16px;}
.step-item{display:flex;gap:13px;align-items:flex-start;
  padding:11px 4px;position:relative;cursor:default;}
.step-item + .step-item::before{content:"";position:absolute;left:17px;
  top:-6px;width:1.5px;height:12px;background:var(--border);}
.step-item.done + .step-item::before,
.step-item.active + .step-item::before{background:var(--brand);opacity:.45;}
.step-dot{width:24px;height:24px;flex-shrink:0;border-radius:50%;
  display:grid;place-items:center;font-size:11px;font-weight:700;
  font-family:var(--mono);background:var(--surface-3);
  color:var(--text-faint);border:1.5px solid transparent;transition:.25s;}
.step-item.active .step-dot{background:var(--brand);color:#fff;
  box-shadow:0 0 0 4px var(--brand-soft);}
.step-item.done .step-dot{background:var(--good-soft);color:var(--good);
  border-color:rgba(47,191,135,.4);}
.step-text{min-width:0;padding-top:1px;}
.step-text .lbl{font-size:13.5px;font-weight:600;color:var(--text-muted);transition:.2s;}
.step-item.active .step-text .lbl{color:var(--text);}
.step-text .sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}

/* ── Panel ───────────────────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  overflow:hidden;animation:panelIn .35s ease;}
@keyframes panelIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.panel-head{padding:30px 34px 22px;border-bottom:1px solid var(--border-soft);}
.panel-head .eyebrow{display:inline-flex;align-items:center;gap:7px;
  font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--brand-2);background:var(--brand-soft);
  border:1px solid rgba(79,124,255,.26);padding:5px 11px;border-radius:999px;
  margin-bottom:14px;}
.panel-head h1{font-size:clamp(22px,3vw,29px);margin:0 0 8px;
  letter-spacing:-.025em;}
.panel-head p{margin:0;color:var(--text-muted);font-size:14.5px;max-width:620px;}
.panel-body{padding:28px 34px 8px;}
.panel-foot{padding:20px 34px 26px;display:flex;align-items:center;gap:12px;
  border-top:1px solid var(--border-soft);background:var(--surface);}
.panel-foot .spacer{flex:1;}
.panel-foot .hint{font-size:12.5px;color:var(--text-faint);}

/* ── Form ────────────────────────────────────────────────────── */
.field{margin-bottom:18px;}
.field label{display:block;font-size:12.5px;font-weight:600;
  color:var(--text-muted);margin-bottom:7px;}
.field label .opt{font-weight:500;color:var(--text-faint);
  font-size:11px;margin-left:5px;text-transform:uppercase;letter-spacing:.06em;}
.field input, .field select, .field textarea{width:100%;padding:11px 13px;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;font-size:14.5px;transition:.18s;}
.field input::placeholder, .field textarea::placeholder{color:var(--text-faint);}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;
  border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,124,255,.18);}
.field .hint{font-size:11.5px;color:var(--text-faint);margin-top:6px;line-height:1.55;}
.field .err{font-size:12px;color:var(--bad);margin-top:6px;display:none;}
.field.invalid input, .field.invalid select{border-color:var(--bad);}
.field.invalid .err{display:block;}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

/* ── Choice cards ────────────────────────────────────────────── */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.choice{position:relative;padding:18px 16px 16px;border:1.5px solid var(--border);
  border-radius:var(--radius);background:var(--surface-2);cursor:pointer;
  transition:.18s;text-align:left;font:inherit;color:inherit;display:block;width:100%;}
.choice:hover{border-color:rgba(79,124,255,.5);background:var(--surface-3);}
.choice.selected{border-color:var(--brand);background:var(--brand-soft);
  box-shadow:0 0 0 3px rgba(79,124,255,.12);}
.choice .choice-ic{width:36px;height:36px;border-radius:10px;display:grid;
  place-items:center;margin-bottom:11px;background:var(--surface-3);
  color:var(--text-muted);transition:.18s;}
.choice.selected .choice-ic{background:var(--brand);color:#fff;}
.choice .choice-ic svg{width:18px;height:18px;}
.choice h4{font-size:14.5px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em;}
.choice p{font-size:12.5px;color:var(--text-muted);margin:0;line-height:1.45;}
.choice .tick{position:absolute;top:12px;right:12px;width:18px;height:18px;
  border-radius:50%;background:var(--brand);color:#fff;
  display:none;place-items:center;font-size:10px;font-weight:800;}
.choice.selected .tick{display:grid;}

/* ── Pills ───────────────────────────────────────────────────── */
.pills{display:flex;flex-wrap:wrap;gap:8px;}
.pill-opt{padding:9px 16px;border-radius:999px;
  border:1.5px solid var(--border);background:var(--surface-2);
  font-size:13.5px;font-weight:600;color:var(--text-muted);
  cursor:pointer;transition:.16s;font:inherit;}
.pill-opt:hover{color:var(--text);border-color:rgba(79,124,255,.5);}
.pill-opt.selected{background:var(--brand-soft);color:var(--brand-2);
  border-color:var(--brand);}

/* ── Templates ───────────────────────────────────────────────── */
.templates{display:grid;gap:12px;}
.template{display:flex;gap:15px;align-items:flex-start;
  padding:17px 18px;border:1.5px solid var(--border);
  border-radius:var(--radius);background:var(--surface-2);
  cursor:pointer;transition:.18s;font:inherit;color:inherit;
  text-align:left;width:100%;}
.template:hover{border-color:rgba(79,124,255,.5);}
.template.selected{border-color:var(--brand);background:var(--brand-soft);
  box-shadow:0 0 0 3px rgba(79,124,255,.12);}
.template .t-radio{width:19px;height:19px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--border);margin-top:2px;
  display:grid;place-items:center;transition:.18s;}
.template.selected .t-radio{border-color:var(--brand);}
.template.selected .t-radio::after{content:"";width:9px;height:9px;
  border-radius:50%;background:var(--brand);}
.template .t-body{min-width:0;flex:1;}
.template .t-body h4{font-size:14.5px;margin:0 0 3px;font-weight:700;}
.template .t-body p{font-size:12.5px;color:var(--text-muted);margin:0;}
.template .t-count{font-family:var(--mono);font-size:11px;font-weight:600;
  color:var(--text-faint);background:var(--surface-3);
  padding:3px 8px;border-radius:6px;flex-shrink:0;}

/* ── Account preview ─────────────────────────────────────────── */
.coa-preview{margin-top:20px;border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  max-height:340px;overflow-y:auto;}
.coa-group{border-bottom:1px solid var(--border-soft);}
.coa-group:last-child{border-bottom:none;}
.coa-group-head{padding:9px 15px;background:var(--surface-2);
  font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-faint);
  position:sticky;top:0;z-index:1;backdrop-filter:blur(8px);}
.coa-row{display:grid;grid-template-columns:62px 1fr auto;
  gap:10px;padding:8px 15px;font-size:13px;align-items:center;
  border-top:1px solid var(--border-soft);}
.coa-row:hover{background:var(--surface-2);}
.coa-row .num{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);}
.coa-row .nm{color:var(--text);}
.coa-row .sub{font-size:10.5px;color:var(--text-faint);
  background:var(--surface-3);padding:2px 7px;border-radius:5px;}

/* ── Balance table ───────────────────────────────────────────── */
.bal-table{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.bal-head{display:grid;grid-template-columns:1fr 160px;gap:10px;
  padding:11px 16px;background:var(--surface-2);font-size:11px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-faint);}
.bal-row{display:grid;grid-template-columns:1fr 160px;gap:10px;
  padding:9px 16px;align-items:center;border-top:1px solid var(--border-soft);}
.bal-row:hover{background:var(--surface-2);}
.bal-row .acct{font-size:13.5px;}
.bal-row .acct small{display:block;font-family:var(--mono);font-size:10.5px;
  color:var(--text-faint);margin-top:1px;}
.bal-row input{width:100%;padding:7px 10px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;
  font-family:var(--mono);font-size:13px;text-align:right;transition:.18s;}
.bal-row input:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(79,124,255,.15);}
.bal-summary{margin-top:20px;padding:18px 20px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--surface-2);}
.bal-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;margin-bottom:14px;}
.bal-cell{text-align:center;}
.bal-cell .k{font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-faint);}
.bal-cell .v{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:3px;
  word-break:break-all;}
.bal-cell.asset .v{color:var(--brand-2);}
.bal-cell.liab .v{color:var(--warn);}
.bal-cell.eq .v{color:var(--good);}
.bal-status{display:flex;align-items:center;gap:9px;justify-content:center;
  padding-top:13px;border-top:1px dashed var(--border);font-size:13px;
  font-weight:600;}
.bal-status.ok{color:var(--good);}
.bal-status.bad{color:var(--bad);}
.bal-status .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
.bal-status.ok .dot{box-shadow:0 0 0 4px var(--good-soft);}
.bal-status.bad .dot{box-shadow:0 0 0 4px var(--bad-soft);}

/* ── Invite list ─────────────────────────────────────────────── */
.invite-list{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
.invite-row{display:flex;align-items:center;gap:10px;padding:10px 13px;
  border:1px solid var(--border);border-radius:10px;
  background:var(--surface-2);animation:slideIn .3s ease;}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.invite-row .avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;background:var(--brand-soft);
  color:var(--brand-2);font-size:11.5px;font-weight:700;font-family:var(--mono);}
.invite-row .who{flex:1;min-width:0;}
.invite-row .who .em{font-size:13px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;}
.invite-row .who .rl{font-size:11px;color:var(--text-faint);margin-top:1px;}
.invite-row .rm{width:28px;height:28px;border-radius:8px;border:none;
  background:transparent;color:var(--text-faint);cursor:pointer;
  display:grid;place-items:center;transition:.16s;}
.invite-row .rm:hover{background:var(--bad-soft);color:var(--bad);}

/* ── Alert ───────────────────────────────────────────────────── */
.alert{display:none;align-items:flex-start;gap:9px;padding:12px 14px;
  border-radius:10px;font-size:13px;margin-bottom:18px;line-height:1.45;}
.alert.show{display:flex;}
.alert-error{background:var(--bad-soft);color:var(--bad);
  border:1px solid rgba(239,90,107,.3);}
.alert-info{background:var(--brand-soft);color:var(--brand-2);
  border:1px solid rgba(79,124,255,.3);}
.alert-ok{background:var(--good-soft);color:var(--good);
  border:1px solid rgba(47,191,135,.3);}

/* ── Page state ─────────────────────────────────────────────── */
.page-state{position:fixed;inset:0;z-index:500;background:var(--bg);
  display:grid;place-items:center;padding:24px;}
.page-state-card{max-width:440px;text-align:center;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:32px 28px;box-shadow:var(--shadow-lg);}
.page-state-card svg{width:44px;height:44px;margin:0 auto 18px;
  color:var(--brand-2);}
.page-state-card h2{font-size:19px;margin:0 0 10px;letter-spacing:-.02em;}
.page-state-card p{font-size:14px;color:var(--text-muted);
  margin:0 0 20px;line-height:1.55;}

/* ── Toasts ─────────────────────────────────────────────────── */
#toasts{position:fixed;bottom:22px;right:22px;z-index:600;
  display:flex;flex-direction:column;gap:10px;align-items:flex-end;
  pointer-events:none;}
.toast{background:var(--surface);border:1px solid var(--border);
  border-left:3px solid var(--brand);border-radius:11px;padding:12px 16px;
  box-shadow:var(--shadow-lg);font-size:13.5px;max-width:340px;
  animation:toastIn .3s ease;pointer-events:auto;}
.toast.err{border-left-color:var(--bad);}
.toast.ok{border-left-color:var(--good);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}

/* ── Confetti ───────────────────────────────────────────────── */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:700;overflow:hidden;}
.confetti span{position:absolute;top:-12px;width:9px;height:9px;
  border-radius:2px;opacity:.9;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0;}}

/* ── Responsive ─────────────────────────────────────────────── */
@media (max-width:980px){
  .wizard{grid-template-columns:1fr;gap:20px;padding-top:24px;}
  .stepper{position:static;padding:14px 16px;display:flex;gap:8px;
    overflow-x:auto;border-radius:var(--radius);
    scrollbar-width:none;}
  .stepper::-webkit-scrollbar{display:none;}

  const host = $('#toasts');

      // De-dup by account number (template may re-list 1010)
      const seen = new Set();
      const relevant = [];
      [...systemAccounts, ...tplAccounts].forEach((a) => {
        if (seen.has(a.number)) return;
        seen.add(a.number);
        relevant.push(a);

      return '' +

            money(Math.abs(diff), State.form.base_currency) +

/* ──────────────────────────────────────────────────────────────────────
   7. RENDERING
   ────────────────────────────────────────────────────────────────────── */
function renderStepper() {
  const host = $('#stepper');
  host.innerHTML = '<h2>Your setup</h2>' + STEPS.map((s, i) => {
    const cls = i < State.step ? 'done' : i === State.step ? 'active' : '';
    const mark = i < State.step ? '✓' : String(i + 1);
    return '<div class="step-item ' + cls + '">' +
      '<span class="step-dot">' + mark + '</span>' +
      '<span class="step-text">' +
        '<div class="lbl">' + escapeHtml(s.label) + '</div>' +
        '<div class="sub">' + escapeHtml(s.sub) + '</div>' +
      '</span>' +
    '</div>';
  }).join('');
}

function renderProgress() {
  const total = STEPS.length;
  const pct = Math.round((State.step / total) * 100);
  $('#progressFill').style.width = pct + '%';
  $('#progressPct').textContent = pct + '%';
}

function renderStep() {
  const step = STEPS[State.step];
  if (!step) return;

  stepAlert('');
  $('#stepEyebrow').textContent = 'Step ' + (State.step + 1) + ' of ' + STEPS.length;
  $('#stepTitle').textContent = step.title;
  $('#stepSubtitle').textContent = step.subtitle;
  $('#stepContent').innerHTML = step.render();

  if (typeof step.mount === 'function') step.mount();

  const back = $('#btnBack');
  const next = $('#btnNext');
  const skip = $('#btnSkip');

  back.disabled = State.step === 0;
  skip.style.display = (State.step === 4) ? '' : 'none';

  const isLast = State.step === STEPS.length - 1;
  next.textContent = isLast ? 'Create workspace' : 'Continue';
  next.disabled = false;

  $('#footHint').textContent = isLast
    ? 'Your books are ready.'
    : 'Takes about 30 seconds.';

  const panel = $('#panel');
  panel.style.animation = 'none';
  void panel.offsetWidth;
  panel.style.animation = '';

  renderStepper();
  renderProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ──────────────────────────────────────────────────────────────────────
   8. NAVIGATION
   ────────────────────────────────────────────────────────────────────── */
function goNext() {
  const step = STEPS[State.step];
  const err = typeof step.validate === 'function' ? step.validate() : '';
  if (err) {
    stepAlert(err);
    toast(err, 'error', 3200);
    return;
  }
  if (State.step < STEPS.length - 1) {
    State.step += 1;
    renderStep();
  } else {
    finish();
  }
}

function goBack() {
  if (State.step === 0) return;
  State.step -= 1;
  renderStep();
}

$('#btnNext').addEventListener('click', goNext);
$('#btnBack').addEventListener('click', goBack);

$('#btnSkip').addEventListener('click', () => {
  State.step = Math.min(State.step + 1, STEPS.length - 1);
  renderStep();
});

$('#btnExit').addEventListener('click', async () => {
  try { await sb.auth.signOut(); } catch (e) {}
  window.location.href = 'index.html';
});

/* ──────────────────────────────────────────────────────────────────────
   9. FINISH — PROVISION THE TENANT
   ────────────────────────────────────────────────────────────────────── */
async function finish() {
  const next = $('#btnNext');
  next.disabled = true;
  next.textContent = 'Building your books…';
  stepAlert('');

  const tpl = COA_TEMPLATES[State.form.coa_template] || COA_TEMPLATES.blank;
  const baseCurrency = State.form.base_currency || 'USD';

  try {
    // 1. Make sure we still have a session
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('Your session expired. Please sign in again.');
    const userId = session.user.id;

    // 2. Insert the tenant.
    //    This fires bootstrap_tenant() which creates tenant_settings,
    //    the 9 system accounts, and the Owner membership row.
    const tenantPayload = {
      owner_id: userId,
      name: State.form.name.trim(),
      legal_name: State.form.legal_name.trim() || null,
      tax_id: State.form.tax_id.trim() || null,
      business_type: State.form.business_type,
      country: State.form.country || null,
      base_currency: baseCurrency,
      fiscal_year_start: State.form.fiscal_year_start,
      materiality_threshold: State.form.materiality_threshold
    };

    const { data: tenant, error: tenantErr } = await sb
      .from('tenants')
      .insert(tenantPayload)
      .select()
      .single();
    if (tenantErr) throw tenantErr;

    const tenantId = tenant.id;

    // 3. Fetch the system accounts the trigger just created,
    //    so we can look them up by number.
    const { data: existingAccounts, error: exErr } = await sb
      .from('accounts')
      .select('id, account_number')
      .eq('tenant_id', tenantId);
    if (exErr) throw exErr;

    const accountByNumber = {};
    (existingAccounts || []).forEach((a) => {
      accountByNumber[a.account_number] = a.id;
    });

    // 4. Insert template accounts (skip ones that already exist)
    const toInsert = [];
    for (const a of tpl.accounts) {
      if (accountByNumber[a.number]) continue;   // already created by system
      toInsert.push({
        tenant_id: tenantId,
        account_number: a.number,
        account_name: a.name,
        account_type: a.type,
        account_subtype: a.subtype,
        is_active: true
      });
    }

    if (toInsert.length) {
      const { data: inserted, error: insErr } = await sb
        .from('accounts')
        .insert(toInsert)
        .select('id, account_number');
      if (insErr) throw insErr;
      (inserted || []).forEach((a) => {
        accountByNumber[a.account_number] = a.id;
      });
    }

    // 5. Post opening balances as a single balanced journal entry.
    const openingEntries = Object.entries(State.form.opening_balances)
      .map(([num, val]) => ({ num, amount: Number(val) || 0 }))
      .filter((e) => e.amount > 0 && accountByNumber[e.num]);

    if (openingEntries.length) {
      // Determine which accounts are Asset vs Liability/Equity so we know
      // which side to post. System + template accounts combined.
      const typeByNumber = {};
      [
        { number:'1000', type:'Asset' }, { number:'1010', type:'Asset' },
        { number:'2000', type:'Liability' }, { number:'3000', type:'Equity' },
        ...tpl.accounts.map((a) => ({ number:a.number, type:a.type }))
      ].forEach((r) => { typeByNumber[r.number] = r.type; });

      let totalDr = 0;
      let totalCr = 0;
      const lines = [];

      openingEntries.forEach((e, idx) => {
        const acctType = typeByNumber[e.num];
        if (!acctType) return;
        const accountId = accountByNumber[e.num];
        if (!accountId) return;

        if (acctType === 'Asset') {
          lines.push({
            account_id: accountId,
            debit_amount: e.amount,
            credit_amount: 0,
            currency: baseCurrency,
            exchange_rate: 1,
            base_debit: e.amount,
            base_credit: 0,
            line_description: 'Opening balance',
            line_number: idx + 1
          });
          totalDr += e.amount;
        } else {
          lines.push({
            account_id: accountId,
            debit_amount: 0,
            credit_amount: e.amount,
            currency: baseCurrency,
            exchange_rate: 1,
            base_debit: 0,
            base_credit: e.amount,
            line_description: 'Opening balance',
            line_number: idx + 1
          });
          totalCr += e.amount;
        }
      });

      // Plug the difference into Opening Balance Equity (3900)
      const diff = totalDr - totalCr;
      if (Math.abs(diff) > 0.005) {
        const obeId = accountByNumber['3900'];
        if (!obeId) {
          // If the system account is missing, create it now.
          const { data: newObe, error: obeErr } = await sb
            .from('accounts')
            .insert({
              tenant_id: tenantId,
              account_number: '3900',
              account_name: 'Opening Balance Equity',
              account_type: 'Equity',
              account_subtype: 'Retained Earnings',
              is_system: true,
              is_active: true
            })
            .select('id')
            .single();
          if (obeErr) throw obeErr;
          accountByNumber['3900'] = newObe.id;
        }

        if (diff > 0) {
          lines.push({
            account_id: accountByNumber['3900'],
            debit_amount: 0,
            credit_amount: diff,
            currency: baseCurrency,
            exchange_rate: 1,
            base_debit: 0,
            base_credit: diff,
            line_description: 'Opening Balance Equity',
            line_number: lines.length + 1
          });
        } else {
          lines.push({
            account_id: accountByNumber['3900'],
            debit_amount: Math.abs(diff),
            credit_amount: 0,
            currency: baseCurrency,
            exchange_rate: 1,
            base_debit: Math.abs(diff),
            base_credit: 0,
            line_description: 'Opening Balance Equity',
            line_number: lines.length + 1
          });
        }
      }

      // Insert the journal entry header
      const { data: entry, error: entryErr } = await sb
        .from('journal_entries')
        .insert({
          tenant_id: tenantId,
          entry_number: 'OB-00001',
          entry_date: new Date().toISOString().slice(0, 10),
          description: 'Opening balances',
          reference_number: 'OB-00001',
          source_type: 'Manual',
          status: 'Posted',
          currency: baseCurrency,
          exchange_rate: 1,
          posted_by: userId,
          posted_at: new Date().toISOString(),
          created_by: userId
        })
        .select()
        .single();
      if (entryErr) throw entryErr;

      // Insert the lines
      if (lines.length) {
        const { error: lineErr } = await sb
          .from('journal_entry_lines')
          .insert(lines.map((l) => ({ ...l, entry_id: entry.id, tenant_id: tenantId })));
        if (lineErr) throw lineErr;
      }
    }

    // 6. Queue team invitations
    if (State.form.invites.length) {
      const inviteRows = State.form.invites.map((inv) => ({
        tenant_id: tenantId,
        email: inv.email,
        role: inv.role,
        invited_by: userId,
        status: 'Pending'
      }));
      const { error: invErr } = await sb.from('invitations').insert(inviteRows);
      if (invErr) {
        // Non-fatal: onboarding is complete, we just couldn't queue invites.
        console.warn('Invitation queue failed:', invErr);
        toast('Workspace created — invitations could not be sent.', 'error', 5000);
      }
    }

    // 7. Celebrate and redirect
    celebrate();
    toast('Workspace created. Welcome to Apex.', 'ok', 3200);
    setTimeout(() => {
      window.location.href = 'dashboard.html?welcome=1';
    }, 1500);

  } catch (err) {
    console.error('Onboarding failed:', err);
    next.disabled = false;
    next.textContent = 'Create workspace';
    stepAlert(
      'We could not finish setting up: ' + (err.message || 'unknown error') +
      '. Nothing was lost — try again.'
    );
    toast('Setup failed. Please review and retry.', 'error', 5000);
  }
}

/* ──────────────────────────────────────────────────────────────────────
   10. CELEBRATION
   ────────────────────────────────────────────────────────────────────── */
function celebrate() {
  const colors = ['#4f7cff','#2fbf87','#f0a13a','#7c5cff','#7aa2ff'];
  const host = document.createElement('div');
  host.className = 'confetti';
  document.body.appendChild(host);

  for (let i = 0; i < 70; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + 'vw';
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    s.style.animationDelay = (Math.random() * 0.5) + 's';
    s.style.width = s.style.height = (6 + Math.random() * 7) + 'px';
    host.appendChild(s);
  }
  setTimeout(() => host.remove(), 4200);
}

/* ──────────────────────────────────────────────────────────────────────
   11. BOOT
   ────────────────────────────────────────────────────────────────────── */
(async function boot() {
  // 1. Session check
  let session;
  try {
    const res = await sb.auth.getSession();
    session = res.data.session;
  } catch (err) {
    showPageState('Could not reach Supabase',
      err.message || 'Check your connection and reload.',
      { label: 'Reload', primary: true, onClick: () => location.reload() });
    return;
  }

  if (!session) {
    showPageState('Please sign in',
      'You need an account to set up a workspace.',
      { label: 'Go to sign in', primary: true, onClick: () => { location.href = 'index.html'; } });
    return;
  }
  State.session = session;

  // 2. If the user already belongs to a tenant, skip onboarding entirely.
  try {
    const { data: existing } = await sb
      .from('tenant_users')
      .select('tenant_id')
      .eq('user_id', session.user.id)
      .eq('is_active', true)
      .limit(1);
    if (existing && existing.length) {
      // Already onboarded — go straight to the dashboard.
      window.location.replace('dashboard.html');
      return;
    }
  } catch (err) {
    // Non-fatal: if this check fails, we let them proceed.
    console.warn('Membership check failed:', err);
  }

  // 3. Prefill from signup metadata
  try {
    const meta = session.user.user_metadata || {};
    if (meta.full_name && !State.user) {
      State.user = { full_name: meta.full_name, email: session.user.email };
    }
    if (meta.company_name) {
      State.form.name = meta.company_name;
    }
  } catch (e) {}

  // 4. Load the currency list from the database
  try {
    const { data: currencies } = await sb
      .from('currencies')
      .select('code, name')
      .eq('is_active', true)
      .order('code');
    State.currencies = currencies || [];
  } catch (err) {
    console.warn('Currency load failed:', err);
    State.currencies = [
      { code:'USD', name:'US Dollar' },
      { code:'EUR', name:'Euro' },
      { code:'GBP', name:'British Pound' },
      { code:'NGN', name:'Nigerian Naira' },
      { code:'KES', name:'Kenyan Shilling' },
      { code:'GHS', name:'Ghanaian Cedi' },
      { code:'ZAR', name:'South African Rand' },
      { code:'INR', name:'Indian Rupee' },
      { code:'CAD', name:'Canadian Dollar' },
      { code:'AUD', name:'Australian Dollar' }
    ];
  }

  // 5. Render the wizard
  hidePageState();
  State.step = 0;
  renderStep();

  console.log(
    '%cApex · onboarding%c v' + APEX_CONFIG.version + ' · connected',
    'font-weight:700;color:#4f7cff', 'color:inherit'
  );
})();
</script>
